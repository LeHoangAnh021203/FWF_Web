<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vòng quay may mắn | Face Wash Fox</title><meta name="theme-color" content="#ff6816"><style>
*{box-sizing:border-box}html{color-scheme:light;scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at 20% 20%,#fff0d8,transparent 55%),#fffaf5;color:#252931;font-family:system-ui,-apple-system,sans-serif}button,a,input,textarea,summary{-webkit-tap-highlight-color:transparent}button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid #15988c;outline-offset:4px}main{max-width:1240px;margin:auto;padding:28px 28px 40px}.brand{display:flex;align-items:center;gap:12px;font-weight:850;font-size:14px;letter-spacing:1px}.brand img{width:48px;height:48px;background:#242428;border-radius:15px;padding:5px}.brand span{display:block;font-size:10px;color:#98816e;letter-spacing:2px;margin-top:4px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.history-link{color:#9a3412;text-decoration:none;background:white;border:1px solid #f6d9c3;border-radius:14px;padding:12px 16px;font-size:13px;font-weight:750}.intro{margin-bottom:24px}h1{font-size:clamp(30px,4vw,46px);letter-spacing:-1.5px;line-height:1.12;margin:0;font-weight:900}h1 span{color:#ff4b10}.intro p{color:#927664;font-size:14px;margin:12px 0 0}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:24px;align-items:start}.panel{background:#fff;border:1px solid #ffe0c7;border-radius:28px;padding:24px;box-shadow:0 18px 40px #f973160b}.stage-panel{background:radial-gradient(ellipse at 50% 38%,#fff0cd,#fff9f1 65%,#fff)}.stage-label{text-align:center;font-size:11px;font-weight:850;letter-spacing:3px;color:#b98445;margin:0 0 16px}.wheel-stage{position:relative;max-width:580px;margin:auto;padding-top:23px}.wheel{position:relative;z-index:1;width:100%;aspect-ratio:1;border-radius:50%;padding:4.4%;background:linear-gradient(145deg,#fff0a8,#ffc225 22%,#ff7a12 56%,#ffd166 83%,#fff6ba);box-shadow:inset 0 7px 10px #ffffff94,inset 0 -12px 18px #c2410c38,0 18px 36px #f9731638,0 0 34px #ffb72438}.wheel:before{content:'';position:absolute;inset:1.7%;border-radius:50%;border:3px solid #ffeaa1b8;pointer-events:none}canvas{display:block;width:100%;height:auto;border-radius:50%;border:2px solid #92400eb8;background:#fff7ed}.bulb{position:absolute;width:2%;height:2%;border-radius:50%;background:radial-gradient(circle,#fffde7 0 22%,#fde047 34%,#f59e0b 72%);border:1px solid #fff7ad;transform:translate(-50%,-50%);box-shadow:0 0 9px #facc15;animation:lights 1.2s ease-in-out infinite alternate;pointer-events:none}.bulb:nth-child(odd){animation-delay:.6s}.pointer{position:absolute;left:50%;top:-10px;transform:translateX(-50%);width:48px;height:48px;border-radius:50%;border:5px solid #4b5563;background:radial-gradient(circle at 35% 28%,#fff7ed 0 8%,#ff3757 9% 46%,#c91d31 76%);box-shadow:0 8px 15px #c2410c47,0 0 0 3px #fbbf2480;z-index:4}.pointer:before,.pointer:after{content:'';position:absolute;left:50%;transform:translateX(-50%);top:39px;border-left:14px solid transparent;border-right:14px solid transparent;border-top:43px solid #facc15}.pointer:after{top:41px;border-left-width:9px;border-right-width:9px;border-top:32px solid #ff3f3f}.center-button{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:17%;height:17%;padding:0;border-radius:50%;border:6px solid #facc15;background:linear-gradient(#27272a,#111827);box-shadow:0 9px 20px #c2410c38,0 0 0 4px #fff7adb8;z-index:3;display:grid;place-items:center}.center-button img{width:76%;height:76%;object-fit:contain}.base{position:relative;width:56%;height:66px;margin:-16px auto 0;background:linear-gradient(90deg,#ff6a12,#ffb31a 48%,#d93d05);border-radius:10px 10px 0 0;clip-path:polygon(20% 0,80% 0,86% 70%,100% 75%,100% 100%,0 100%,0 75%,14% 70%)}.base:after{content:'';position:absolute;bottom:0;left:0;right:0;height:18px;background:linear-gradient(#ffe4ab,#ffb631);border-top:3px solid #fff4c9}.actions{text-align:center;margin-top:12px}button{cursor:pointer;font-family:inherit;font-weight:800;border:0}button:disabled{opacity:.5;cursor:default}#spin{background:linear-gradient(180deg,#ff771b,#f0440a);color:white;border-radius:16px;font-size:18px;min-height:56px;width:min(100%,350px);box-shadow:0 10px 22px #f0440a29;border-bottom:3px solid #c93d0b}#result{text-align:center;font-size:clamp(19px,2.2vw,25px);font-weight:850;min-height:68px;display:grid;place-items:center;color:#9a3412;padding:14px 8px}label{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#7d7168;margin:18px 0 0}input{accent-color:#f45b12;width:16px;height:16px}h2{font-size:18px;margin:0;font-weight:850}.panel-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}#count{display:grid;place-items:center;min-width:34px;height:30px;background:#fff0e3;color:#e9580c;border-radius:9px;font-weight:850;font-size:14px}#people{max-height:485px;overflow:auto;scrollbar-width:thin;scrollbar-color:#f3d9c1 transparent}.person{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #f7eee7;font-size:13px}.person .index{color:#baaa9b;width:22px;font-size:11px}.person .name{flex:1;font-weight:650}.person .number{background:#fff5eb;border:1px solid #ffe0c7;color:#dd590f;border-radius:9px;padding:6px 9px;font-weight:850;min-width:37px;text-align:center}details{margin-top:16px;border-top:1px solid #f7eee7;padding-top:16px}summary{font-size:12px;color:#a6714b;cursor:pointer;font-weight:700}textarea{width:100%;height:230px;margin-top:14px;border:1px solid #ecd8c6;border-radius:12px;padding:12px;font:13px/1.7 system-ui;resize:vertical}.secondary{padding:11px 13px;border-radius:10px;font-size:12px;background:#fff0e3;color:#9a3412;margin-top:10px}#status{font-size:12px;color:#9a3412;line-height:1.5}#status:empty{display:none}.history-panel{margin-top:20px}#history{margin:14px 0 0;padding-left:22px;color:#9a3412;font-size:13px;line-height:2}#history:empty:before{content:'Kết quả may mắn sẽ xuất hiện tại đây.';color:#a49487;display:block;font-size:12px;margin-left:-22px}.spark{position:absolute;color:#f9b62b;font-size:24px;pointer-events:none}.spark.one{top:9%;left:1%}.spark.two{top:22%;right:0;color:#55c8bc}.spark.three{bottom:10%;left:2%;color:#f39fb6}footer{text-align:center;margin-top:26px;color:#b5967f;font-size:10px;letter-spacing:2px}@keyframes lights{to{box-shadow:0 0 16px #fde047,0 0 24px #facc1580}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.bulb{animation:none}}@media(min-width:1000px){.intro{text-align:center;margin:30px 0}.intro h1{font-size:44px}}@media(max-width:760px){main{padding:20px 14px}header{margin-bottom:26px}.layout{grid-template-columns:1fr}.panel{padding:20px 16px;border-radius:24px}.intro p{font-size:12px}h1{max-width:340px}.wheel-stage{max-width:470px}.history-link{padding:10px;font-size:11px}.brand{font-size:11px}.brand img{width:40px;height:40px}.pointer{width:38px;height:38px;border-width:4px;top:-6px}.pointer:before{top:30px;border-top-width:33px;border-left-width:11px;border-right-width:11px}.pointer:after{top:32px;border-top-width:24px;border-left-width:7px;border-right-width:7px}.center-button{border-width:4px}#people{max-height:330px}.base{height:52px}.stage-label{font-size:10px}}
</style></head><body>
<main><header><div class="brand"><img src="/binh-chon-assets/logo.png" alt="Face Wash Fox"><div>FACE WASH FOX<span>GIA ĐÌNH NHÀ CÁO</span></div></div><a class="history-link" href="#history-panel">◷ Lịch sử quay</a></header>
<div class="intro"><h1>Vòng quay <span>may mắn</span> FWF</h1><p>Chạm để quay · May mắn đang chờ bạn</p></div>
<div class="layout"><section class="panel stage-panel" aria-label="Vòng quay may mắn"><p class="stage-label">MỘT VÒNG QUAY · NGÀN NIỀM VUI</p><div class="wheel-stage"><span class="spark one" aria-hidden="true">✦</span><span class="spark two" aria-hidden="true">✧</span><span class="spark three" aria-hidden="true">✦</span><div class="wheel"><div class="pointer" aria-hidden="true"></div><canvas id="wheel" width="1400" height="1400" aria-label="Vòng quay tên và số của người tham gia"></canvas><div id="lights" aria-hidden="true"></div><button id="center-spin" class="center-button" aria-label="Quay ngay"><img src="/binh-chon-assets/logo.png" alt=""></button></div><div class="base" aria-hidden="true"></div></div>
<div id="result" role="status" aria-live="polite">Ai sẽ là người may mắn?</div><div class="actions"><button id="spin">◎ &nbsp; Quay ngay</button><label><input type="checkbox" id="remove"> Loại người đã trúng khỏi lượt tiếp theo</label></div></section>
<aside><section class="panel"><div class="panel-heading"><h2>Người tham gia</h2><span id="count">25</span></div><div id="people"></div><details><summary>Chỉnh sửa danh sách</summary><textarea id="entries" aria-label="Danh sách tên và số" spellcheck="false">Nguyễn Thanh Duy (bibot) - 03
Nguyễn Thị Quế Trân - 26
Nguyễn Hải Yến - 45
Dương Chí Quảng - 08
Trịnh Nguyễn Phương Uyên - 26
Nguyễn Lương Thanh Nhã - 68
Oliver - 77
Trần Khánh Ly - 12
Trương Mỹ Ngân - 66
Tống Thụy Hiền Diệu - 97
Vũ Phương Hà Uyên - 23
Nguyễn Phạm Minh Thư - 00
Nguyễn Thị Yến Nhi - 05
Trần Lâm Xuân Hằng - 14
Nguyễn Nhi - 28
Cao Trung Toàn - 39
Nguyễn Thị Yến Linh - 75
Nguyễn Thị Ngọc Hân - 87
Trần Thị Hà Phương - 24
Lê Nguyễn Tuyết Nhi - 27
Hồng Phương Nhã - 69
Đặng Nguyễn Ngọc Trâm - 02

Nguyễn Thị Hải Linh - 16
Trần Như Linh - 09</textarea><button class="secondary" id="apply">Cập nhật danh sách</button> <button class="secondary" id="download">Tải danh sách</button></details><p id="status" role="status"></p></section><section id="history-panel" class="panel history-panel"><h2>◷ Lịch sử quay</h2><ol id="history"></ol></section></aside></div><footer>FACE WASH FOX · GỬI TRAO MAY MẮN</footer></main><script>
const $=id=>document.getElementById(id),canvas=$('wheel'),ctx=canvas.getContext('2d'),tau=Math.PI*2;
let entries=$('entries').value.trim().split('\n'),rotation=0,busy=false,pendingRemoval=null;
const colors=['#fff0d2','#ff6816','#fff0d2','#f5a5cc','#37bdb0'];
function draw(){
 ctx.clearRect(0,0,1400,1400);const n=entries.length;if(!n)return;
 const step=tau/n;ctx.save();ctx.translate(700,700);ctx.rotate(rotation);
 entries.forEach((name,i)=>{const start=-Math.PI/2+i*step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,697,start,start+step);ctx.closePath();const gradient=ctx.createRadialGradient(0,0,120,0,0,700);gradient.addColorStop(0,colors[i%colors.length]);gradient.addColorStop(1,['#ebd9b6','#dd4109','#ebd9b6','#e77baa','#188f85'][i%5]);ctx.fillStyle=gradient;ctx.fill();ctx.strokeStyle='#fff8ef';ctx.lineWidth=3;ctx.stroke();ctx.save();ctx.rotate(start+step/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle=i%5===0||i%5===2?'#a13d13':'#ffffff';let size=27;ctx.font=`600 ${size}px system-ui`;while(ctx.measureText(name).width>500&&size>12){size--;ctx.font=`600 ${size}px system-ui`;}ctx.fillText(name,658,0);ctx.restore();});ctx.restore();
}
function renderPeople(){ $('people').replaceChildren();entries.forEach((entry,i)=>{const row=document.createElement('div');row.className='person';const split=entry.lastIndexOf(' - ');for(const [cls,text] of [['index',String(i+1).padStart(2,'0')],['name',split<0?entry:entry.slice(0,split)],['number',split<0?'—':entry.slice(split+3)]]){const span=document.createElement('span');span.className=cls;span.textContent=text;row.append(span);}$('people').append(row);});}
function sync(){renderPeople(); $('entries').value=entries.join('\n');$('count').textContent=entries.length;$('spin').disabled=!entries.length;$('center-spin').disabled=!entries.length;draw(); }
function uniform(n){const a=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a);}while(a[0]>=limit);return a[0]%n;}
function lock(value){busy=value;['spin','center-spin','apply','entries','remove'].forEach(id=>$(id).disabled=value);if(!value){$('spin').disabled=!entries.length;$('center-spin').disabled=!entries.length;}}
$('spin').onclick=()=>{
 if(busy)return;
 if(pendingRemoval!==null){entries.splice(pendingRemoval,1);pendingRemoval=null;rotation=0;sync();}
 if(!entries.length){$('result').textContent='Đã quay hết người tham gia.';return;}
 lock(true);$('status').textContent='';$('result').textContent='Đang quay…';
 const winner=uniform(entries.length),step=tau/entries.length,target=(tau-(winner+.5)*step)%tau;
 const start=rotation,delta=6*tau+((target-start%tau+tau)%tau),duration=matchMedia('(prefers-reduced-motion: reduce)').matches?100:5200;let began;
 function frame(now){if(began===undefined)began=now;const t=Math.min(1,(now-began)/duration);rotation=start+delta*(1-Math.pow(1-t,4));draw();if(t<1){requestAnimationFrame(frame);}else{rotation=target;draw();const name=entries[winner];$('result').textContent='🎉 '+name;const li=document.createElement('li');li.textContent=name;$('history').prepend(li);if($('remove').checked){pendingRemoval=winner;$('status').textContent='Người vừa trúng sẽ được loại khi bắt đầu lượt tiếp theo.';}lock(false);}}
 requestAnimationFrame(frame);
};
$('apply').onclick=()=>{if(busy)return;const next=[...new Set($('entries').value.split('\n').map(s=>s.trim()).filter(Boolean))];if(!next.length){$('status').textContent='Vui lòng nhập ít nhất một người.';return;}entries=next;pendingRemoval=null;rotation=0;sync();$('result').textContent='Sẵn sàng quay!';$('status').textContent='Đã cập nhật '+entries.length+' người.';};
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([entries.join('\n')],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='danh-sach-nguoi-tham-gia.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('center-spin').onclick=()=>$('spin').click();
for(let i=0;i<36;i++){const bulb=document.createElement('span');bulb.className='bulb';const a=i*tau/36;bulb.style.left=(50+47.7*Math.sin(a))+'%';bulb.style.top=(50-47.7*Math.cos(a))+'%';$('lights').append(bulb);}
renderPeople();draw();
</script></body></html>
